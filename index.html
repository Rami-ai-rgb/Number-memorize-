<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="board1" class="boardElements1">
        <h1>Number Memory</h1>
        <button id="startBt">Start</button>
    </div>
    <div id="board2" class="boardElements2">
        <p id="numberDisplay">0</p>
        <div class="progress-track">
            <div id="progress-bar" class="progress-fill"></div>
        </div>
    </div>
    <div id="board3" class="boardElements3">
        <input type="text" id="input">
        <button id="submitBt">Submit</button>
    </div>
    <div id="board4" class="boardElements4">
        <p id="score"></p>
        <p id="p1">Number:</p>
        <p id="p2"></p>
        <p id="p3">Your number:</p>
        <p id="p4"></p>
        <div id="buttonDiv" class="buttons">
            <button id="nextBt">Next</button>
            <button id="restartBt">Restart</button>
        </div>
    </div>
        <script src="index.js"></script>
</body>
</html>
